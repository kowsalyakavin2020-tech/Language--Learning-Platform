<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="certTitle">
  <title id="certTitle">Certificate of completion illustration</title>
  <defs>
    <linearGradient id="certBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFEBFF"/>
      <stop offset="100%" stop-color="#F7F6FF"/>
    </linearGradient>
    <linearGradient id="certCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7F6FF"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB648"/>
      <stop offset="100%" stop-color="#FF9A2E"/>
    </linearGradient>
  </defs>

  <circle cx="250" cy="250" r="230" fill="url(#certBg)"/>

  <!-- decorative dots -->
  <circle cx="90" cy="120" r="7" fill="#4A3AFF" opacity=".25"/>
  <circle cx="420" cy="150" r="10" fill="#FFB648" opacity=".35"/>
  <circle cx="70" cy="360" r="9" fill="#FFB648" opacity=".3"/>
  <circle cx="430" cy="370" r="6" fill="#4A3AFF" opacity=".3"/>

  <!-- certificate card -->
  <g>
    <rect x="115" y="95" width="270" height="230" rx="18" fill="url(#certCard)" stroke="#E7E4F8" stroke-width="2"/>
    <rect x="115" y="95" width="270" height="230" rx="18" fill="none" stroke="#4A3AFF" stroke-width="3" stroke-dasharray="4 10" opacity=".35"/>

    <!-- header bar -->
    <rect x="145" y="125" width="210" height="14" rx="7" fill="#4A3AFF"/>
    <rect x="175" y="153" width="150" height="9" rx="4.5" fill="#C9C3F5"/>

    <!-- laurel / medal -->
    <circle cx="250" cy="225" r="38" fill="#4A3AFF"/>
    <circle cx="250" cy="225" r="38" fill="none" stroke="#FFB648" stroke-width="4"/>
    <path d="M232 213 L246 229 L272 201" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- lines -->
    <rect x="175" y="278" width="150" height="8" rx="4" fill="#E7E4F8"/>
    <rect x="200" y="296" width="100" height="8" rx="4" fill="#E7E4F8"/>
  </g>

  <!-- ribbon tails hanging from medal -->
  <path d="M230 258 L216 320 L250 300 L284 320 L270 258 Z" fill="url(#ribbonGrad)"/>

  <!-- floating stars -->
  <g fill="#FFB648">
    <path d="M400 230 l6 13 14 2-10 10 2 14-12-7-12 7 2-14-10-10 14-2z"/>
    <path d="M105 250 l5 10 11 1-8 8 2 11-10-5-10 5 2-11-8-8 11-1z"/>
  </g>
</svg>
